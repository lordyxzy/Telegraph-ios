name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Telegraph
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fix Git and Submodules
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          
          git config --file .gitmodules submodule.RichEditorView.url https://github.com/cjwirth/RichEditorView.git
          git submodule sync
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
          xcodebuild -resolvePackageDependencies -project Telegraph.xcodeproj -scheme Telegraph

      - name: Build App
        run: |
          xcodebuild clean build \
            -project Telegraph.xcodeproj \
            -scheme Telegraph \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -scmProvider system \
            CONFIGURATION_BUILD_DIR="${PWD}/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/Telegraph.app Payload/
          zip -qr Telegraph.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegraph-IPA
          path: Telegraph.ipa
